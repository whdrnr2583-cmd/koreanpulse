name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # agentprod is a path dep in pyproject.toml. The CI checkout doesn't
      # contain ../agentprod, so we vendor it via git into a sibling dir.
      - name: Fetch agentprod sibling
        run: |
          git clone --depth 1 https://github.com/whdrnr2583-cmd/agentprod.git ../agentprod || \
            (echo "::warning::agentprod repo not yet public; using stub" && \
             mkdir -p ../agentprod/src/agentprod && \
             echo "from typing import Any" > ../agentprod/src/agentprod/__init__.py)

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          # Install agentprod first if it has a real package
          if [ -f ../agentprod/pyproject.toml ]; then
            pip install -e ../agentprod
          fi
          pip install -e '.[dev]'

      - name: Run pytest
        run: pytest -q

      - name: Lint with ruff
        run: ruff check src tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
