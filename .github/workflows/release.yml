name: release

# Triggers on git tags like `v0.1.0`. The tag's version must match
# `pyproject.toml` `[project].version` or PyPI will reject upload.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # needed for the GitHub release
  id-token: write   # needed for PyPI trusted publishing (no API token in repo)

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi   # configure once in repo Settings → Environments

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify version matches tag
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::tag $TAG_VER != pyproject.toml version $PKG_VER"
            exit 1
          fi

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No token argument → uses OIDC trusted publishing.
        # Configure once: pypi.org → your project → Publishing → Add → GitHub
        # Owner: whdrnr2583-cmd, Repo: koreanpulse, Workflow: release.yml,
        # Environment: pypi.

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
