<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    koreanpulse — placeholder logo.
    Square monochrome mark + wordmark. Replace with proper brand work
    before launch; this is enough to clear marketplace icon requirements.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1116"/>
      <stop offset="100%" stop-color="#1F2933"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="256" height="256" rx="48" ry="48" fill="url(#g)"/>

  <!-- Pulse waveform: stylized EKG-like line evoking "industry pulse" -->
  <g stroke="#F0B429" stroke-width="10" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <polyline points="
      32,128
      72,128
      88,80
      104,176
      120,56
      136,200
      152,112
      168,128
      224,128"/>
  </g>

  <!-- 'kp' monogram -->
  <g font-family="'Inter','SF Pro Display',system-ui,sans-serif"
     font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <text x="128" y="220" font-size="42" letter-spacing="2">koreanpulse</text>
  </g>
</svg>
