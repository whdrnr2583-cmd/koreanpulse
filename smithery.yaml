# Smithery MCP server manifest.
# https://smithery.ai/docs/build/project-config

name: koreanpulse
displayName: koreanpulse — Korean Stock Market Intelligence (DART, Foreign & Activist Investors)
description: |
  Real-time Korean stock market intelligence for AI assistants, as an
  MCP server. Track Korean DART (전자공시) corporate disclosures as they
  are filed, monitor foreign investor holding changes (BlackRock /
  Vanguard / Norges / GIC / Temasek + 15 more) and activist investor
  campaigns (KCGI / Align / ValueAct / Elliott), and search Korean
  industry news across classified categories — all KOSPI / KOSDAQ /
  KRX data, delivered in English with named-entity classification.
  Free public daily snapshot at koreanpulse.dev/today. Connect via
  hosted remote MCP (mcp.koreanpulse.dev/mcp) for ChatGPT / Claude.ai,
  or pip install for Claude Desktop / Cursor. Data and intelligence
  only — not buy/sell recommendations. OSS self-host (AGPL); paid
  Cloud tiers for the watchlist-to-alert workflow (ships Q3 2026).
homepage: https://koreanpulse.dev
repository: https://github.com/whdrnr2583-cmd/koreanpulse
license: AGPL-3.0-or-later
icon: https://raw.githubusercontent.com/whdrnr2583-cmd/koreanpulse/main/docs/assets/logo.svg

tags:
  - korea
  - korean-stocks
  - korean-market-data
  - stock-market
  - finance
  - hedge-fund
  - dart
  - dart-api
  - kospi
  - kosdaq
  - activist
  - foreign-investors
  - disclosures
  - research
  - industry
  - english

# How Smithery should run the server.
startCommand:
  type: stdio
  command: koreanpulse
  args: []

# Required environment variables Smithery will surface in its UI.
env:
  - name: DART_API_KEY
    description: |
      Korean Financial Supervisory Service (DART) OpenAPI key.
      Free at https://opendart.fss.or.kr/. 40,000 calls/day per key.
    required: true

  - name: OPENAI_API_KEY
    description: |
      OpenAI key for server-side translation/summarization (default provider).
      Optional — without it, tools return Korean-only fields.
    required: false

  - name: ANTHROPIC_API_KEY
    description: |
      Anthropic key, alternative to OpenAI for translation.
      Set KOREANPULSE_TRANSLATE_PROVIDER=anthropic to use this instead.
    required: false

  - name: KOREANPULSE_CACHE_MODE
    description: |
      'local' (default, OSS self-host: BYOK OpenAI key + local JSONL
      translation cache) or 'hosted' (Cloud Solo / Analyst / Desk:
      route translation calls to our Cloudflare Worker, no OpenAI key
      needed on your side, license-gated).
    required: false
    default: "local"

  - name: KOREANPULSE_LICENSE_KEY
    description: |
      Required when KOREANPULSE_CACHE_MODE=hosted. Issued by Polar
      on subscription (kp_…). Subscribe / join the waitlist at
      https://koreanpulse.dev/pricing.
    required: false

  - name: KOREANPULSE_REQUIRE_LICENSE
    description: |
      Set to "1" in production to enforce paid license keys.
      Off by default for local development.
    required: false
    default: "0"
